[build-system]
requires = ["setuptools>=70.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pivotq"
version = "0.1.0.dev0"
description = "CPU and QPU hybrid programming, distributed execution and performance prediction."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "ray[default]==2.31.0",
    "qiskit==2.5.1",
    "numpy>=2.0,<3.0",
    "google-api-core==2.15.0",
    "googleapis-common-protos==1.62.0",
    "proto-plus==1.23.0",
    "protobuf==4.25.8",
    "setuptools==80.9.0",
]

[project.optional-dependencies]
qpu = ["httpx>=0.27,<1"]
test = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pivotq*"]
exclude = ["ray_quantum_ir", "ray_quantum_ir.*"]

[tool.setuptools.package-data]
"pivotq._internal.performance" = ["lib/*.so", "include/*.h", "examples/**/*.json", "examples/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
