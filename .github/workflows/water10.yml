name: Ten-water application
on:
  push:
    paths: ['applications/multi-h2o-aimd-v4/**', 'tests/integration/run_cpu_water10.py', 'pyproject.toml', 'uv.lock', '.github/workflows/water10.yml']
  pull_request:
    paths: ['applications/multi-h2o-aimd-v4/**', 'tests/integration/run_cpu_water10.py', 'pyproject.toml', 'uv.lock', '.github/workflows/water10.yml']
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python -B applications/multi-h2o-aimd-v4/scripts/verify_migration.py
      - run: uv run --locked python -B -m pytest applications/multi-h2o-aimd-v4/tests -q
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
