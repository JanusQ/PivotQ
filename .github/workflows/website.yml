name: Website

on:
  push:
    branches: [main]
    paths: ['website/**', 'packages/framework/examples/**', '.github/workflows/website.yml']
  pull_request:
    branches: [main]
    paths: ['website/**', 'packages/framework/examples/**', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    env:
      SITE_URL: https://janusq.github.io
      SITE_BASE: /PivotQ/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build:release
      - name: Check example data and circuits
        run: |
          node scripts/check-results.mjs
          node scripts/check-circuit.mjs
          node scripts/check-aimd-analysis.mjs
          node scripts/check-aimd-workbench.mjs
      - run: npx playwright install --with-deps chromium
      - name: Check the website in Chromium
        env:
          PORTAL_TEST_URL: http://127.0.0.1:4321/PivotQ/
        run: |
          ./node_modules/.bin/astro preview --host 127.0.0.1 --port 4321 --ignore-lock > "$RUNNER_TEMP/website-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null "$PORTAL_TEST_URL"; then
              ready=true
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/website-preview.log"
            exit 1
          fi
          npm run test:browser
      - name: Upload website
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
